name: Publish malloyyo CLI

# A merge to main is the signal to release. scripts/release.ts reconciles the
# version in packages/cli/package.json against the npm registry: it patch-bumps
# (and commits back) an already-published version, or publishes as-is when the
# PR carried its own semver bump. The bump commit carries [skip ci] so it does
# not re-trigger this workflow.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. Register
# `@malloydata/malloyyo` on npmjs.com with a trusted publisher pointing at this
# repo + this workflow, and leave token publishing enabled so an authorized
# person can run the same `npm run release` from the command line.
#
# THE PUBLISHING REPOSITORY IS `malloydata/malloyyo`, AND ONLY IT. A fork inherits
# both this workflow and the package name, so the job below refuses to run anywhere
# else. Otherwise a merge to a fork's main can walk all the way to `npm publish` and
# stop only because that fork happens not to have an npm credential — a protection
# that lasts exactly as long as nobody adds one. The condition is on the repository
# rather than on a secret being absent, because "auth is not configured here" is a
# coincidence and "this is not the publishing repo" is the rule.

on:
  push:
    branches: [main]
    paths:
      # Anything that changes the published CLI bytes is a release signal. The
      # CLI bundles the engine into dist/index.js, so engine changes ship as a
      # CLI patch — even though the engine is private and never published alone.
      - "packages/cli/**"
      - "packages/mcp-engine/**"
      - ".github/workflows/cli-publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "build + npm publish --dry-run, no registry or git writes"
        type: boolean
        default: false

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    # The publishing repository, and only it. A fork inherits this workflow and the
    # package name with it; see the note at the top.
    if: github.repository == 'malloydata/malloyyo'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump + push the tag
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need history to rebase before pushing the bump

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # Trusted publishing needs a recent npm.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: packages/cli
        run: npm run release ${{ inputs.dry_run && '-- --dry-run' || '' }}

name: screenshot

# Test, build — and, on demand, publish — the screenshot service image
# (screenshot/, ghcr.io/malloydata/malloyyo-screenshot). See screenshot/README.md.
#
# It lives in this repo because it is half of one protocol with the app (the
# /screenshot page, the token header, the diagnostics), but it is its own
# package and never part of the app's build.
#
# PUBLISHING IS MANUAL, like the dev container: `workflow_dispatch` only.
# Merging a change here does not change `:latest`; dispatch this workflow from
# main to ship it. PRs run the lockdown test and build and smoke-test the
# image without publishing.
#
# No secrets: the push uses the built-in GITHUB_TOKEN. One-time after the first
# publish: set the GHCR package `malloyyo-screenshot` to Public if self-hosters
# should pull it without credentials.

on:
  pull_request:
    paths:
      - "screenshot/**"
      - ".github/workflows/screenshot.yml"
  workflow_dispatch: {}

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/malloyyo-screenshot

jobs:
  screenshot:
    if: github.repository == 'malloydata/malloyyo' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: screenshot
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The lockdown, end to end: the real service against a fixture app whose
      # page tries to leave (test.mjs).
      - name: Lockdown test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm test

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: screenshot
          load: true
          tags: malloyyo-screenshot:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=screenshot
          cache-to: type=gha,mode=max,scope=screenshot

      # The image starts, launches its browser and answers health.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name shot -p 3100:3100 \
            -e APP_ORIGIN=http://127.0.0.1:9 -e SCREENSHOT_SERVICE_KEY=ci-smoke-key-0123456789 \
            malloyyo-screenshot:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3100/healthz > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"browser":true' health.json
          docker rm -f shot

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && github.repository == 'malloydata/malloyyo'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        if: github.event_name == 'workflow_dispatch' && github.repository == 'malloydata/malloyyo'
        uses: docker/build-push-action@v6
        with:
          context: screenshot
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=screenshot
          cache-to: type=gha,mode=max,scope=screenshot

      - name: Publishing is a separate, manual step
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Built and verified — but NOT published"
            echo ""
            echo "This image publishes only from a manual run:"
            echo "**Actions → screenshot → Run workflow** (branch \`main\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the digest
        if: steps.publish.outcome == 'success'
        run: |
          {
            echo "### Screenshot service published"
            echo ""
            echo '```'
            echo "${IMAGE}@${{ steps.publish.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
